  #gate { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  h1 { margin: 0 0 6px; font-size: 2rem; font-weight: 400; letter-spacing: 0.04em; }
  input {
    font: inherit;
    font-size: 1.6rem;
    letter-spacing: 0.3em;
    text-align: center;
    width: 8em;
    padding: 6px 0;
    color: #fff;
    background: rgba(0,0,0,.25);
    border: 0;
    border-bottom: 2px solid #fff;
    border-radius: 0;
    outline: none;
  }
  input:focus-visible { border-bottom-width: 4px; }
  #msg { min-height: 1.2em; font-size: 0.95rem; color: #ffd0cc; }
  #gate.shake input { animation: shake 0.3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { #gate.shake input { animation: none; } }
  #secret, #dev { display: none; }
  #dev { font-size: 2rem; letter-spacing: 0.08em; }
  #secret a { font-size: 1.3rem; color: #fff; }

<body>
  <div id="gate">
    <h1>Enter code</h1>
    <input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Code" autofocus>
    <div id="msg" role="alert"></div>
  </div>

  <div id="dev">CODE: 1205</div>

  <div id="secret">
    <!-- Replace the href below with your YouTube link -->
    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener">https://www.youtube.com/watch?v=dQw4w9WgXcQ</a>
  </div>

<script>
  var input = document.getElementById('code');
  var gate = document.getElementById('gate');
  var secret = document.getElementById('secret');
  var dev = document.getElementById('dev');
  var msg = document.getElementById('msg');

  function check(final) {
    var v = input.value.trim().toLowerCase();
    if (v === 'gorg') {
      gate.style.display = 'none';
      secret.style.display = 'block';
    } else if (v === 'secretdev') {
      gate.style.display = 'none';
      dev.style.display = 'block';
    } else if (final && v.length) {
      msg.textContent = 'Wrong code. Try again.';
      gate.classList.remove('shake');
      void gate.offsetWidth;
      gate.classList.add('shake');
      input.select();
    }
  }
  input.addEventListener('input', function () { msg.textContent = ''; check(false); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(true); });
</script>
</body>
